---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    reviewers:
      - jylenhof
    assignees:
      - jylenhof
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      deps-external:
        patterns:
          - '*'
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    reviewers:
      - jylenhof
    assignees:
      - jylenhof
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      deps-pre-commit:
        patterns:
          - '*'
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    reviewers:
      - jylenhof
    assignees:
      - jylenhof
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      deps-python:
        patterns:
          - '*'
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
